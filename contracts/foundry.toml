[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# paris avoids PUSH0, which some non-mainline EVM/revive targets do not support
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# deploy script writes addresses to deployments/<chainid>.json
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[invariant]
runs = 64
depth = 30
fail_on_revert = false

[fmt]
line_length = 120
