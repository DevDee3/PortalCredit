<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B1220"/>
  <!-- portal ring with a gap, like a vault dial -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="96 24" transform="rotate(-60 32 32)"/>
  <!-- gold coin / dot -->
  <circle cx="32" cy="32" r="6.5" fill="#F5C451"/>
</svg>
